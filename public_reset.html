<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Reset password</title>
</head>
<body>
  <h1>Reset Password</h1>
  <form id="reset">
    <input type="hidden" id="email"/>
    <input type="hidden" id="token"/>
    <input type="password" id="newPassword" placeholder="New password" required/><br/>
    <button type="submit">Reset</button>
  </form>
  <div id="message"></div>

  <script>
  // parse token & email from query
  const params = new URLSearchParams(window.location.search);
  document.getElementById('email').value = params.get('email') || '';
  document.getElementById('token').value = params.get('token') || '';

  document.getElementById('reset').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value;
    const token = document.getElementById('token').value;
    const newPassword = document.getElementById('newPassword').value;
    const res = await fetch('/api/auth/reset', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, token, newPassword })
    });
    const json = await res.json();
    document.getElementById('message').innerText = json.message || JSON.stringify(json);
  });
  </script>
</body>
</html>
