<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Sign Up</title>
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>
</head>
<body>
  <h1>Sign Up</h1>
  <form id="signup">
    <input type="email" name="email" id="email" placeholder="Email" required/><br/>
    <input type="password" name="password" id="password" placeholder="Password" required/><br/>
    <!-- reCAPTCHA widget (v2) -->
    <div class="g-recaptcha" data-sitekey="RECAPTCHA_SITE_KEY_REPLACE"></div>
    <br/>
    <button type="submit">Sign Up</button>
  </form>

  <div id="message"></div>

  <script>
  document.getElementById('signup').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    // get token for v2 checkbox
    const recaptchaToken = grecaptcha && grecaptcha.getResponse ? grecaptcha.getResponse() : '';
    const res = await fetch('/api/auth/signup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password, recaptchaToken })
    });
    const json = await res.json();
    document.getElementById('message').innerText = json.message || JSON.stringify(json);
  });
  </script>
</body>
</html>
